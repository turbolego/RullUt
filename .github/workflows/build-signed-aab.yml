name: Build signed AAB

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build signed Android App Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Install Android SDK platform
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=$ANDROID_HOME \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "platform-tools" \
            2>&1 | tail -5

      - name: Generate upload keystore
        run: |
          mkdir -p app/keystore
          keytool -genkey -v \
            -keystore app/keystore/rullut-upload-keystore.jks \
            -alias "${{ secrets.KEY_ALIAS }}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 18250 \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -dname "${{ secrets.KEY_DNAME }}"

      - name: Create keystore.properties
        run: |
          cat > app/keystore.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=keystore/rullut-upload-keystore.jks
          EOF

      - name: Build signed release AAB
        run: gradle bundleRelease --no-daemon

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: RullUt-release-${{ github.ref_name }}
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
