name: Build signed AAB

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build signed Android App Bundle
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate deterministic signing keystore
        env:
          KEY_SECRET: ${{ secrets.KEY_SECRET }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          pip3 install pycryptodome
          mkdir -p app/keystore
          python3 scripts/keystore_gen.py app/keystore/rullut-upload-keystore.jks

      - name: Build AAB with Gradle
        env:
          STORE_FILE: app/keystore/rullut-upload-keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rullut-release.aab
          path: app/build/outputs/bundle/release/app-release.aab
