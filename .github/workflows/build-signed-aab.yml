name: Build signed AAB

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build signed Android App Bundle
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Deterministic keystore cache key
        id: keystore_hash
        env:
          KEY_SECRET: ${{ secrets.KEY_SECRET }}
        run: |
          echo "hash=$(echo -n "$KEY_SECRET" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore cached keystore
        id: cache_keystore
        uses: actions/cache@v4
        with:
          path: app/keystore/rullut-upload-keystore.jks
          key: rullut-keystore-${{ steps.keystore_hash.outputs.hash }}

      - name: Generate keystore (if not cached)
        if: steps.cache_keystore.outputs.cache-hit != 'true'
        env:
          KEY_SECRET: ${{ secrets.KEY_SECRET }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          pip3 install pycryptodome cryptography
          mkdir -p app/keystore
          python3 scripts/keystore_gen.py app/keystore/rullut-upload-keystore.jks

      - name: Build AAB with Gradle
        env:
          STORE_FILE: app/keystore/rullut-upload-keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rullut-release.aab
          path: app/build/outputs/bundle/release/app-release.aab
